name: Daily Reel
# Step 1 (07:30 UTC = 13:00 IST): fetch last night's results and commit data/night.json.
# Step 2 (09:30 UTC = 15:00 IST): render the Reel from night.json + story.json and post it.
# Posts only when the repo variable POST_LIVE is 'true'; otherwise it is a dry run (video saved as an artifact).
on:
  workflow_dispatch:
    inputs:
      date:
        description: "ET date YYYYMMDD (blank = last night)"
        required: false
      post:
        description: "Really post to Instagram? (true/false)"
        default: "false"
      story_only:
        description: "Only post the Story, skip the Reel (true/false)"
        default: "false"
  schedule:
    - cron: "30 7 * * *"   # 13:00 IST: fetch night.json for the story task
    - cron: "0 12 * * *"   # 17:30 IST: render and post

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reel/package-lock.json
      - run: node --test test/fetch-night.test.mjs
      - name: Fetch results
        run: node scripts/fetch-night.mjs ${{ github.event.inputs.date }}
      - name: Early run - commit night.json for the story task, then stop
        if: github.event.schedule == '30 7 * * *'
        run: |
          git config user.name hoopx-bot; git config user.email bot@users.noreply.github.com
          git add -f data/night.json && git commit -m "night data" && git push || true
      - id: gate
        run: if [ "${{ github.event.schedule }}" = "30 7 * * *" ]; then echo "status=early" >> "$GITHUB_OUTPUT"; else echo "status=$(node -p "require('./data/night.json').status")" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci
        if: steps.gate.outputs.status == 'ok'
        working-directory: reel
      - id: prep
        if: steps.gate.outputs.status == 'ok'
        run: node scripts/prepare-props.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Render
        if: steps.gate.outputs.status == 'ok'
        working-directory: reel
        run: npx remotion render src/index.jsx ${{ steps.prep.outputs.composition }} out/reel.mp4 --props=props.json --codec=h264 --crf=20
      - name: Render cover image (title frame)
        if: steps.gate.outputs.status == 'ok'
        working-directory: reel
        run: npx remotion still src/index.jsx ${{ steps.prep.outputs.composition }} out/cover.jpg --props=props.json --frame=75 --image-format=jpeg --jpeg-quality=92
      - name: Render Story card
        if: steps.gate.outputs.status == 'ok'
        working-directory: reel
        run: npx remotion still src/index.jsx StoryCard out/storycard.jpg --props=card.json --image-format=jpeg --jpeg-quality=92
      - name: Build Story video (headline card + first 17s of the Reel)
        if: steps.gate.outputs.status == 'ok'
        working-directory: reel/out
        continue-on-error: true
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -y -loop 1 -framerate 30 -t 3 -i storycard.jpg -t 17 -i reel.mp4 -f lavfi -t 3 -i anullsrc=r=44100:cl=stereo \
            -filter_complex "[0:v]scale=1080:1920,format=yuv420p,setsar=1[a];[1:v]scale=1080:1920,fps=30,format=yuv420p,setsar=1[b];[2:a]aformat=sample_rates=44100:channel_layouts=stereo[s];[1:a]aformat=sample_rates=44100:channel_layouts=stereo[m];[a][s][b][m]concat=n=2:v=1:a=1[v][au]" \
            -map "[v]" -map "[au]" -c:v libx264 -crf 20 -preset veryfast -c:a aac -b:a 128k -movflags +faststart story.mp4
      - name: Post (dry run unless post=true)
        if: steps.gate.outputs.status == 'ok'
        env:
          POST: ${{ github.event.inputs.post || vars.POST_LIVE }}
          STORY_ONLY: ${{ github.event.inputs.story_only }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/post.mjs
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.status == 'ok'
        with:
          name: reel-${{ github.run_id }}
          path: |
            data/night.json
            reel/out/reel.mp4
            reel/out/cover.jpg
            reel/out/storycard.jpg
            reel/out/story.mp4
          retention-days: 3
